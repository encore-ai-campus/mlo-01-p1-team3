# =============================================================================
# [START] Source EC2 hourly resource.log rotation configuration
# Purpose:
#   Rotate /var/log/car-market/resource.log every hour, compress completed
#   files, and stage them for the daily SSH/rsync transfer to Monitoring.
# Deploy outside /etc/logrotate.d as /etc/car-market/resource-logrotate.conf.
# =============================================================================

/var/log/car-market/resource.log {
    hourly
    rotate 168
    missingok
    notifempty
    dateext
    dateformat -%Y%m%dT%H%M%S
    compress
    nocreate
    olddir /var/log/car-market/archive-outbox
    createolddir 0750 root root
    su root root
}

# =============================================================================
# [END] Source EC2 hourly resource.log rotation configuration
# =============================================================================
